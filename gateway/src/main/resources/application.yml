server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ai-property-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 1MB

gateway:
  agent:
    base-url: ${FASTAPI_BASE_URL:http://127.0.0.1:8000}
    query-path: ${FASTAPI_QUERY_PATH:/api/v1/assistant/query}
    code-query-path: ${FASTAPI_CODE_QUERY_PATH:/api/v1/assistant/query/code}
    tables-path: ${FASTAPI_TABLES_PATH:/api/v1/assistant/tables}
    upload-path: ${FASTAPI_UPLOAD_PATH:/api/v1/assistant/tables/upload}
    download-path: ${FASTAPI_DOWNLOAD_PATH:/api/v1/assistant/download}
    connect-timeout: 3s
    read-timeout: 60s
    download-read-timeout: 120s
    max-json-response-bytes: 12000000
    download-max-bytes: 20000000
    download-max-concurrent: 16
    upload-max-bytes: 20000000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.example.propertyassistant: INFO
